name: Windows Desktop Build

on:
  push:
    branches:
      - feature/windows-filename-sort
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: photos-desktop-windows

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop native/runtime dependencies
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run postinstall

      - name: Generate NAPI bindings
        working-directory: desktop
        run: npm run codegen:napi

      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build-main -- --win --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ente-windows-filename-sort
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14