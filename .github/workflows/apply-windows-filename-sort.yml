name: Apply Windows filename sort

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Verify filename sort patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sorter = Path("web/packages/gallery/utils/file.ts").read_text()
          header = Path("web/apps/photos/src/components/Collections/CollectionHeader.tsx").read_text()

          required = [
              "DesktopFileSortOrder",
              "filename-asc",
              "filename-desc",
              "文件名 A → Z",
              "文件名 Z → A",
          ]
          missing = [x for x in required if x not in sorter + header]
          if missing:
              raise SystemExit("Filename sort patch is incomplete: " + ", ".join(missing))
          print("Filename sort patch is already present; nothing to apply.")
